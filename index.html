<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Погода на планете: 15 городов России</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eaf2ff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;top:14px;left:16px;font-size:13px;opacity:.6;pointer-events:none}
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:#5ab0ff}
  #card{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);
    min-width:280px;max-width:90vw;padding:18px 22px;border-radius:16px;
    background:rgba(10,20,40,.72);border:1px solid rgba(120,180,255,.35);
    backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .5s}
  #card.show{opacity:1}
  #city{font-size:22px;font-weight:600}
  #temp{font-size:56px;font-weight:300;line-height:1.1}
  #desc{opacity:.8;margin-bottom:10px}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:14px}
  #grid span.k{opacity:.6;margin-right:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Погода в 15 городах России · данные Open-Meteo</div>
<div id="progress"></div>
<div id="card">
  <div id="city"></div>
  <div id="temp"></div>
  <div id="desc"></div>
  <div id="grid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Данные ----------
const CITIES = [
  { name: "Москва",           lat: 55.7558, lon: 37.6173 },
  { name: "Санкт-Петербург",  lat: 59.9343, lon: 30.3351 },
  { name: "Новосибирск",      lat: 55.0084, lon: 82.9357 },
  { name: "Екатеринбург",     lat: 56.8389, lon: 60.6057 },
  { name: "Казань",           lat: 55.7887, lon: 49.1221 },
  { name: "Нижний Новгород",  lat: 56.2965, lon: 43.9361 },
  { name: "Челябинск",        lat: 55.1644, lon: 61.4368 },
  { name: "Самара",           lat: 53.1959, lon: 50.1008 },
  { name: "Омск",             lat: 54.9885, lon: 73.3242 },
  { name: "Ростов-на-Дону",   lat: 47.2357, lon: 39.7015 },
  { name: "Уфа",              lat: 54.7388, lon: 55.9721 },
  { name: "Красноярск",       lat: 56.0153, lon: 92.8932 },
  { name: "Воронеж",          lat: 51.6720, lon: 39.1843 },
  { name: "Пермь",            lat: 58.0105, lon: 56.2502 },
  { name: "Владивосток",      lat: 43.1155, lon: 131.8855 }
];

const SLOT_MS = 10000;                 // сколько показывается каждый город
const TOTAL_MS = SLOT_MS * CITIES.length;
const R = 1.6;                         // радиус планеты
const EARTH_TEX = "https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-blue-marble.jpg";

let weather = [];                      // данные по городам (по индексу)

// ---------- Вспомогательные функции ----------
// Координаты -> точка на сфере (совпадает с UV-раскладкой SphereGeometry)
function ll2v(lat, lon, r) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(r * Math.cos(la) * Math.cos(lo),
                           r * Math.sin(la),
                           -r * Math.cos(la) * Math.sin(lo));
}

const WMO = {
  0: "Ясно", 1: "Преимущественно ясно", 2: "Переменная облачность", 3: "Пасмурно",
  45: "Туман", 48: "Изморозь", 51: "Слабая морось", 53: "Морось", 55: "Сильная морось",
  56: "Ледяная морось", 57: "Ледяная морось", 61: "Слабый дождь", 63: "Дождь", 65: "Сильный дождь",
  66: "Ледяной дождь", 67: "Ледяной дождь", 71: "Слабый снег", 73: "Снег", 75: "Сильный снег",
  77: "Снежная крупа", 80: "Ливень", 81: "Ливень", 82: "Сильный ливень",
  85: "Снегопад", 86: "Сильный снегопад", 95: "Гроза", 96: "Гроза с градом", 99: "Сильная гроза с градом"
};
const DIRS = ["С", "СВ", "В", "ЮВ", "Ю", "ЮЗ", "З", "СЗ"];
const dirName = deg => DIRS[Math.round(deg / 45) % 8];

// ---------- Сцена ----------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
let distCur = 9, distTarget = 3.6;     // в начале камера приближается к планете
camera.position.set(0, 0, distCur);

scene.add(new THREE.AmbientLight(0x404060, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(5, 3, 5);
scene.add(sun);

// Звёзды
{
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(1500 * 3);
  for (let i = 0; i < 1500; i++) {
    const v = new THREE.Vector3().randomDirection ? null : null;
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
    const r = 60 + Math.random() * 40;
    pos.set([r * s * Math.cos(th), r * u, r * s * Math.sin(th)], i * 3);
  }
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 })));
}

// Планета
const planet = new THREE.Group();
scene.add(planet);

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(R, 64, 64),
  new THREE.MeshPhongMaterial({ color: 0x2a6fb0, shininess: 12 })   // запасной цвет
);
planet.add(globe);
new THREE.TextureLoader().load(EARTH_TEX, tex => {
  globe.material.map = tex;
  globe.material.color.set(0xffffff);
  globe.material.needsUpdate = true;
});

// Атмосфера
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.05, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0x4aa8ff, transparent: true, opacity: 0.12,
    side: THREE.BackSide, blending: THREE.AdditiveBlending })
);
scene.add(atmo);

// Маркеры городов
const markers = CITIES.map(c => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16),
                           new THREE.MeshBasicMaterial({ color: 0xffcc33 }));
  m.position.copy(ll2v(c.lat, c.lon, R * 1.01));
  planet.add(m);
  return m;
});

// ---------- Карточка ----------
const $ = id => document.getElementById(id);
const card = $("card");

function fillCity(i) {
  const c = CITIES[i], w = weather[i];
  $("city").textContent = `${i + 1}/${CITIES.length}  ${c.name}`;
  if (!w) {
    $("temp").textContent = "";
    $("desc").textContent = "Загрузка данных…";
    $("grid").innerHTML = "";
    return;
  }
  const cur = w.current;
  $("temp").textContent = `${Math.round(cur.temperature_2m)}°C`;
  $("desc").textContent = WMO[cur.weather_code] ?? "—";
  const rows = [
    ["Ощущается", `${Math.round(cur.apparent_temperature)}°C`],
    ["Ветер", `${cur.wind_speed_10m.toFixed(1)} м/с, ${dirName(cur.wind_direction_10m)}`],
    ["Влажность", `${cur.relative_humidity_2m}%`],
    ["Давление", `${Math.round(cur.pressure_msl)} гПа`],
    ["Осадки", `${cur.precipitation} мм`],
    ["Облачность", `${cur.cloud_cover}%`]
  ];
  $("grid").innerHTML = rows.map(([k, v]) => `<div><span class="k">${k}</span>${v}</div>`).join("");
}

let targetQ = new THREE.Quaternion();
function focusCity(i) {
  const c = CITIES[i];
  const v = ll2v(c.lat, c.lon, 1).normalize();
  targetQ.setFromUnitVectors(v, new THREE.Vector3(0, 0, 1)); // повернуть город к камере
}

function showCity(i) {
  focusCity(i);
  fillCity(i);
  card.classList.add("show");
  distTarget = 3.6;
}

function showOverview() {
  card.classList.add("show");
  $("city").textContent = "Итоги: все 15 городов";
  $("temp").textContent = "";
  $("desc").textContent = "Обзор температур";
  $("grid").innerHTML = CITIES.map((c, i) => {
    const t = weather[i] ? `${Math.round(weather[i].current.temperature_2m)}°C` : "—";
    return `<div><span class="k">${c.name}</span>${t}</div>`;
  }).join("");
}

// ---------- Загрузка погоды (Open-Meteo, без ключа) ----------
async function loadWeather() {
  const url = "https://api.open-meteo.com/v1/forecast?" + new URLSearchParams({
    latitude: CITIES.map(c => c.lat).join(","),
    longitude: CITIES.map(c => c.lon).join(","),
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,weather_code",
    wind_speed_unit: "ms",
    timezone: "auto"
  });
  try {
    const res = await fetch(url);
    const data = await res.json();
    weather = Array.isArray(data) ? data : [data];
  } catch (e) {
    console.error("Не удалось загрузить погоду:", e);
  }
}

// ---------- Таймлайн ----------
// Всё привязано к моменту загрузки страницы, поэтому при каждом обновлении
// показ начинается заново с Москвы и идёт одинаково.
const t0 = performance.now();
let lastIdx = -1, finished = false;

function loop(now) {
  const t = now - t0;
  const dt = 1 / 60;
  const k = 1 - Math.exp(-dt * 3);

  if (t < TOTAL_MS) {
    const idx = Math.floor(t / SLOT_MS);
    if (idx !== lastIdx) {
      lastIdx = idx;
      showCity(idx);
    }
  } else if (!finished) {
    finished = true;
    lastIdx = -1;
    card.classList.remove("show");
    setTimeout(() => {
      distTarget = 13;                 // камера отдаляется от планеты
      showOverview();
    }, 1200);
  }

  // Плавное вращение планеты к текущему городу и зум камеры
  planet.quaternion.slerp(targetQ, k);
  distCur += (distTarget - distCur) * k;
  camera.position.set(0, 0, distCur);
  camera.lookAt(0, 0, 0);

  // Подсветка текущего города и прогресс-бар
  markers.forEach((m, i) => m.scale.setScalar(i === lastIdx ? 2.4 : 1));
  $("progress").style.width = Math.min(t / TOTAL_MS, 1) * 100 + "%";

  atmo.quaternion.copy(planet.quaternion);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Старт: сначала грузим погоду, затем запускаем анимацию
loadWeather().then(() => {
  if (lastIdx >= 0 && lastIdx < CITIES.length) fillCity(lastIdx); // дозаполнить, если данные пришли позже
  if (finished) showOverview();
});
requestAnimationFrame(loop);
</script>
</body>
</html>
